name: Java CI + PostGIS Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Instalar CTP Cliente 
        run: chmod +x ./mvnw install -DskipTests
        working-directory: libs/ctp-cliente

      - name: Compilar main project
        run: ./mvnw compile

      - name: Correr tests 
        run: ./mvnw -B verify
        env:
          DB_USER: test
          DB_PASSWORD: test

      - name: Upload tests y reportes de coverage 
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
