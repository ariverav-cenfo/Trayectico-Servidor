name: Java CI + PostGIS Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgrouting/pgrouting:16-3.5-3.8
        env:
          POSTGRES_DB: TrayecticoDB
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U test -d TrayecticoDB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install CTP client
        run: ./mvnw install -DskipTests -f libs/ctp-cliente/pom.xml

      - name: Compile
        run: ./mvnw compile

      - name: Run tests
        run: ./mvnw -B verify
        env:
          DB_USER: test
          DB_PASSWORD: test