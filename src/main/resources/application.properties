spring.application.name=Trayectico-Servidor
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/TrayecticoDB
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.jpa.hibernate.ddl-auto=validate

aresep.url=${ARESEP_URL:https://datos.aresep.go.cr/ws.datosabiertos/Services/IT/PliegoTarifario.svc/ObtenerPliegoTarifarioAutobus/0}
aresep.timeout-seconds=120
aresep.import-on-startup=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
