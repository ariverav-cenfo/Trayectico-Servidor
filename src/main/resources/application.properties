spring.application.name=Trayectico-Servidor
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/TrayecticoDB
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.jpa.hibernate.ddl-auto=validate

aresep.url=${ARESEP_URL:https://datos.aresep.go.cr/ws.datosabiertos/Services/IT/PliegoTarifario.svc/ObtenerPliegoTarifarioAutobus/0}
aresep.timeout-seconds=120
aresep.import-on-startup=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_CLIENT_ID:sin-configurar}
app.seguridad.correos-admin=${ADMIN_EMAILS:}

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-20b}

photon.url=https://photon.komoot.io/api/
photon.timeout-seconds=15